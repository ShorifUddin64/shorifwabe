<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Office · Interactive Portfolio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="load">Opening the office…</div>
<canvas id="c"></canvas>
<header class="top"><b>THE OFFICE</b><span>/ 01</span><div class="sp"></div><i class="dot"></i><em>INTERACTIVE OFFICE</em>
<label>Quality <select id="q"><option value="0">Low</option><option value="1">Medium</option><option value="2" selected>High</option></select></label><label>Time <select id="tod" title="Night is available in High quality"><option value="0">Day</option><option value="1">Night</option></select></label></header>
<nav id="menu" aria-label="Rooms"></nav>
<aside id="panel" hidden></aside>
<div id="cap"><h3 id="ct"></h3><p id="cp"></p></div>
<div class="ctl"><button id="pz">Pause</button><button id="ex">Exit demo</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="js/config.js"></script>
<script src="js/01-core.js"></script>
<script src="js/02-people.js"></script>
<script src="js/03-world.js"></script>
<script src="js/04-motion.js"></script>
<script src="js/05-story-ui.js"></script>
<script src="js/models.js"></script>
<script src="js/textures.js"></script>
<script>addEventListener("load",function(){if(typeof CONFIG==="undefined"||typeof THREE==="undefined"){var d=document.createElement("div");d.style.cssText="position:fixed;inset:0;z-index:99;background:#fff;color:#222;padding:30px;font:16px sans-serif";d.innerHTML="<h2>Files not found</h2><p>Keep the folder structure exactly as in the zip (index.html, css/, js/, models/, textures/). Upload the whole folder, not only index.html. Internet is needed for three.js.</p>";document.body.appendChild(d)}});</script>
</body>
</html>
